<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Pedro Torisu" />
    <meta name="description" content="Pedro Torisu, desenvolvedor Full Stack com foco em back-end. Projetos com Node.js, TypeScript, Java, Python e React." />
    <title>Pedro Torisu · Desenvolvedor Full Stack com foco em back-end</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (!theme) {
            var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
            theme = mql && mql.matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
